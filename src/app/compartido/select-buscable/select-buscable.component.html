<div class="select-buscable">
  <button type="button" class="form-select disparador" (click)="alternar()"
          [disabled]="deshabilitado()"
          [attr.aria-expanded]="abierto()" aria-haspopup="listbox">
    <span [class.marcador]="seleccionVigente() === null">{{ textoSeleccion() }}</span>
  </button>

  @if (abierto()) {
    <div class="panel">
      <div class="buscador">
        <input #busqueda type="search" class="form-control form-control-sm"
               [placeholder]="textoBusqueda()" [value]="filtro()"
               (input)="actualizarFiltro($event)" (keydown)="alTeclear($event)"
               role="combobox" aria-expanded="true" aria-controls="listaOpciones"
               [attr.aria-activedescendant]="'opcion-' + resaltada()">
      </div>

      <ul class="lista" id="listaOpciones" role="listbox">
        @for (opcion of opcionesFiltradas(); track $index) {
          <li>
            <button type="button" class="opcion" role="option" [id]="'opcion-' + $index"
                    [attr.aria-selected]="opcion === seleccionVigente()"
                    [class.opcion-activa]="opcion === seleccionVigente()"
                    [class.opcion-resaltada]="$index === resaltada()"
                    (click)="elegir(opcion)">
              {{ etiqueta()(opcion) }}
            </button>
          </li>
        } @empty {
          <li class="sin-resultados">Sin resultados</li>
        }
      </ul>
    </div>
  }
</div>
