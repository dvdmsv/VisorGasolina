<div class="toolbar">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand">VisorGasolina</a>
      <button class="navbar-toggler" type="button" (click)="alternarMenu()"
              aria-controls="menuPrincipal" [attr.aria-expanded]="menuAbierto()"
              aria-label="Abrir o cerrar la navegación">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="navbar-collapse" id="menuPrincipal" [class.collapse]="!menuAbierto()">
        <div class="navbar-nav">
          @for (combustible of combustibles; track combustible.ruta) {
            <a class="nav-link" [routerLink]="'/' + combustible.ruta"
               routerLinkActive="active"
               (click)="cerrarMenu()">{{ combustible.etiqueta }}</a>
          }
          <a class="nav-link" routerLink="/favoritos" routerLinkActive="active" (click)="seleccionarFavoritos()">Favoritos</a>
        </div>
      </div>
    </div>
  </nav>
</div>
