<header class="barra">
  <div class="barra-fila">
    <a class="marca" [routerLink]="'/' + combustibles[0].ruta">VisorGasolina</a>

    <div class="acciones">
      <a class="accion" routerLink="/favoritos" routerLinkActive="accion-activa"
         (click)="seleccionarFavoritos()" title="Favoritos">
        <app-icono nombre="estrella" [tamano]="20" />
        <span class="visually-hidden">Favoritos</span>
      </a>

      <button type="button" class="accion" (click)="alternarTema()"
              [attr.aria-pressed]="modoOscuro()"
              [title]="modoOscuro() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'">
        <app-icono [nombre]="modoOscuro() ? 'sol' : 'luna'" [tamano]="20" />
        <span class="visually-hidden">{{ modoOscuro() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro' }}</span>
      </button>
    </div>
  </div>

  <div class="pestanas-envoltorio">
    <nav class="pestanas" aria-label="Tipo de combustible">
    @for (combustible of combustibles; track combustible.ruta) {
      <a class="pestana" [routerLink]="'/' + combustible.ruta"
         routerLinkActive="pestana-activa"
         #enlace="routerLinkActive"
         [attr.aria-current]="enlace.isActive ? 'page' : null">{{ combustible.etiqueta }}</a>
    }
    </nav>
  </div>
</header>
