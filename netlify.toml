[build]
  command = "npm run build"
  publish = "dist/visor-gasolina/browser"

# Netlify inyecta un comentario publicitario en el HTML servido (326 bytes). El service worker
# compara el hash del index.html que generó con el que recibe, no coinciden, y se degrada a
# EXISTING_CLIENTS_ONLY: en ese estado responde 504 a todo lo que no tenga cacheado, lo que dejó
# el mapa sin teselas. Desactivar el post-procesado evita la inyección.
[build.processing]
  skip_processing = true

# La app dejó de usar HashLocationStrategy: Netlify debe servir index.html
# en cualquier ruta para que el enrutador de Angular la resuelva.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://sedeaplicaciones.minetur.gob.es; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'"

# Los ficheros con hash en el nombre no cambian nunca: se pueden cachear para siempre.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El manifest necesita su tipo real: Netlify lo sirve como application/octet-stream y, con
# X-Content-Type-Options "nosniff", el navegador lo descarta y la aplicación no es instalable.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# El service worker y su manifiesto son los que detectan que hay una versión nueva: si se
# cachean, las actualizaciones no llegan nunca. La regla /*.js de arriba les habría puesto un
# año de caché inmutable.
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

# index.html sí cambia en cada despliegue y debe revalidarse.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
