[build]
  command = "npm run build"
  publish = "dist/visor-gasolina/browser"

# La app dejó de usar HashLocationStrategy: Netlify debe servir index.html
# en cualquier ruta para que el enrutador de Angular la resuelva.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://sedeaplicaciones.minetur.gob.es; frame-ancestors 'none'"
